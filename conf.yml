layers:
  - image: images/0_photo.jpg
    filters:
      - name: grayscale
      - name: gaussianblur
        params:
          window: 5
          sigma: 2.0
  - image: images/1_pop_bike.png
    filters:
      - name: gaussianblur
        params:
          window: 10
          sigma: 4.2
    blend: normal
    opacity: 0.32
  - image: images/2_wall.png
    filters: []
    blend: lighten
    opacity: 1.0